
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-mono)}
.wrap{padding:1rem 0}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.ctrl-group{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--color-text-secondary)}
select,button{font-size:13px;padding:5px 12px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-primary);cursor:pointer}
button:hover{background:var(--color-background-secondary)}
button:disabled{opacity:0.4;cursor:not-allowed}
.btn-primary{background:var(--color-background-info);color:var(--color-text-info);border-color:var(--color-border-info)}
#canvas{display:block;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md)}
.legend{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap}
.leg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--color-text-secondary)}
.dot{width:12px;height:12px;border-radius:3px;flex-shrink:0}
.info-bar{display:flex;gap:20px;margin-top:12px;padding:10px 14px;background:var(--color-background-secondary);border-radius:var(--border-radius-md);font-size:13px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat-label{font-size:11px;color:var(--color-text-secondary)}
.stat-val{font-weight:500;color:var(--color-text-primary)}
</style>
<div class="wrap">
<h2 class="sr-only">Maze generator and solver with DFS and BFS algorithms</h2>
<div class="controls">
  <div class="ctrl-group">
    Ukuran:
    <select id="sizeSelect">
      <option value="11">Kecil (11×11)</option>
      <option value="21" selected>Sedang (21×21)</option>
      <option value="31">Besar (31×31)</option>
    </select>
  </div>
  <div class="ctrl-group">
    Algoritma:
    <select id="algoSelect">
      <option value="dfs">DFS (Stack)</option>
      <option value="bfs">BFS (Queue)</option>
    </select>
  </div>
  <div class="ctrl-group">
    Kecepatan:
    <select id="speedSelect">
      <option value="80">Lambat</option>
      <option value="30" selected>Sedang</option>
      <option value="5">Cepat</option>
      <option value="0">Instan</option>
    </select>
  </div>
  <button id="btnNew" class="btn-primary">Buat Labirin Baru</button>
  <button id="btnSolve" disabled>Cari Jalan!</button>
  <button id="btnReset" disabled>Reset</button>
</div>
<canvas id="canvas"></canvas>
<div class="legend">
  <div class="leg"><div class="dot" style="background:#1D9E75"></div>Start</div>
  <div class="leg"><div class="dot" style="background:#D4537E"></div>Finish</div>
  <div class="leg"><div class="dot" style="background:#9FE1CB"></div>Jalur dieksplorasi</div>
  <div class="leg"><div class="dot" style="background:#FAC775"></div>Jalur solusi</div>
</div>
<div class="info-bar">
  <div class="stat"><span class="stat-label">Status</span><span class="stat-val" id="statusTxt">Klik "Buat Labirin Baru"</span></div>
  <div class="stat"><span class="stat-label">Node dieksplorasi</span><span class="stat-val" id="exploredTxt">—</span></div>
  <div class="stat"><span class="stat-label">Panjang jalur</span><span class="stat-val" id="pathTxt">—</span></div>
  <div class="stat"><span class="stat-label">Struktur data</span><span class="stat-val" id="structTxt">—</span></div>
</div>
</div>
<script>
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
let ROWS,COLS,CELL,grid,start,end,solving=false,animId=null;

const WALL=0,PATH=1,EXPLORED=2,SOLUTION=3,START=4,END=5;

const COLORS={
  [WALL]:'#2C2C2A',
  [PATH]:'#F1EFE8',
  [EXPLORED]:'#9FE1CB',
  [SOLUTION]:'#FAC775',
  [START]:'#1D9E75',
  [END]:'#D4537E',
};

function isDark(){return window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches}

function getColors(){
  const dark=isDark();
  return{
    [WALL]:dark?'#1a1a18':'#2C2C2A',
    [PATH]:dark?'#2c2c2a':'#F1EFE8',
    [EXPLORED]:dark?'#0F6E56':'#9FE1CB',
    [SOLUTION]:dark?'#854F0B':'#FAC775',
    [START]:'#1D9E75',
    [END]:'#D4537E',
  };
}

function initCanvas(){
  const n=parseInt(document.getElementById('sizeSelect').value);
  ROWS=n; COLS=n;
  const maxW=Math.min(window.innerWidth-48,520);
  CELL=Math.floor(maxW/COLS);
  canvas.width=COLS*CELL;
  canvas.height=ROWS*CELL;
}

function drawCell(r,c,type){
  const colors=getColors();
  ctx.fillStyle=colors[type]||colors[WALL];
  ctx.fillRect(c*CELL,r*CELL,CELL,CELL);
}

function drawAll(){
  const colors=getColors();
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      ctx.fillStyle=colors[grid[r][c]]||colors[WALL];
      ctx.fillRect(c*CELL,r*CELL,CELL,CELL);
    }
  }
  drawCell(start[0],start[1],START);
  drawCell(end[0],end[1],END);
}

function generateMaze(){
  grid=Array.from({length:ROWS},()=>Array(COLS).fill(WALL));
  const stack=[[1,1]];
  grid[1][1]=PATH;
  const dirs=[[0,2],[2,0],[0,-2],[-2,0]];
  while(stack.length){
    const [r,c]=stack[stack.length-1];
    const shuffled=[...dirs].sort(()=>Math.random()-0.5);
    let moved=false;
    for(const [dr,dc] of shuffled){
      const nr=r+dr,nc=c+dc;
      if(nr>0&&nr<ROWS-1&&nc>0&&nc<COLS-1&&grid[nr][nc]===WALL){
        grid[r+dr/2][c+dc/2]=PATH;
        grid[nr][nc]=PATH;
        stack.push([nr,nc]);
        moved=true;
        break;
      }
    }
    if(!moved) stack.pop();
  }
  start=[1,1];
  end=[ROWS-2,COLS-2];
  grid[start[0]][start[1]]=PATH;
  grid[end[0]][end[1]]=PATH;
}

function btnState(gen,solve,reset){
  document.getElementById('btnNew').disabled=gen;
  document.getElementById('btnSolve').disabled=solve;
  document.getElementById('btnReset').disabled=reset;
}

function setStatus(t,e,p,s){
  document.getElementById('statusTxt').textContent=t||'—';
  document.getElementById('exploredTxt').textContent=e!==undefined?e:'—';
  document.getElementById('pathTxt').textContent=p!==undefined?p:'—';
  document.getElementById('structTxt').textContent=s||'—';
}

document.getElementById('btnNew').onclick=function(){
  if(animId){clearTimeout(animId);animId=null;}
  solving=false;
  initCanvas();
  generateMaze();
  drawAll();
  btnState(false,false,true);
  setStatus('Labirin siap!','—','—','—');
};

document.getElementById('btnSolve').onclick=function(){
  if(solving) return;
  solving=true;
  btnState(true,true,false);
  const algo=document.getElementById('algoSelect').value;
  const speed=parseInt(document.getElementById('speedSelect').value);
  solve(algo,speed);
};

document.getElementById('btnReset').onclick=function(){
  if(animId){clearTimeout(animId);animId=null;}
  solving=false;
  for(let r=0;r<ROWS;r++)
    for(let c=0;c<COLS;c++)
      if(grid[r][c]===EXPLORED||grid[r][c]===SOLUTION) grid[r][c]=PATH;
  drawAll();
  btnState(false,false,false);
  setStatus('Reset. Siap dicoba lagi!','—','—','—');
};

function solve(algo,speed){
  const struct=algo==='dfs'?'Stack (LIFO)':'Queue (FIFO)';
  setStatus('Sedang mencari...','0','—',struct);

  const visited=Array.from({length:ROWS},()=>Array(COLS).fill(false));
  const parent=Array.from({length:ROWS},()=>Array(COLS).fill(null));
  const dirs=[[0,1],[1,0],[0,-1],[-1,0]];

  let frontier=[start];
  visited[start[0]][start[1]]=true;
  let found=false;
  let exploredCount=0;
  const steps=[];

  while(frontier.length&&!found){
    const cur=algo==='dfs'?frontier.pop():frontier.shift();
    steps.push({type:'explore',r:cur[0],c:cur[1]});
    exploredCount++;
    if(cur[0]===end[0]&&cur[1]===end[1]){found=true;break;}
    for(const [dr,dc] of dirs){
      const nr=cur[0]+dr,nc=cur[1]+dc;
      if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&grid[nr][nc]!==WALL&&!visited[nr][nc]){
        visited[nr][nc]=true;
        parent[nr][nc]=cur;
        frontier.push([nr,nc]);
      }
    }
  }

  let pathLen=0;
  if(found){
    let cur=end;
    while(cur){
      steps.push({type:'solution',r:cur[0],c:cur[1]});
      cur=parent[cur[0]][cur[1]];
      pathLen++;
    }
  }

  if(speed===0){
    for(const s of steps){
      if(s.type==='explore'&&!(s.r===start[0]&&s.c===start[1])&&!(s.r===end[0]&&s.c===end[1]))
        grid[s.r][s.c]=EXPLORED;
      else if(s.type==='solution'&&!(s.r===start[0]&&s.c===start[1])&&!(s.r===end[0]&&s.c===end[1]))
        grid[s.r][s.c]=SOLUTION;
    }
    drawAll();
    setStatus(found?'Jalur ditemukan!':'Tidak ada jalur!',exploredCount,found?pathLen:'—',struct);
    solving=false;
    btnState(false,true,false);
    return;
  }

  let i=0;
  function tick(){
    const batch=Math.max(1,Math.floor(1+20/speed));
    for(let b=0;b<batch&&i<steps.length;b++,i++){
      const s=steps[i];
      if(!(s.r===start[0]&&s.c===start[1])&&!(s.r===end[0]&&s.c===end[1])){
        grid[s.r][s.c]=s.type==='solution'?SOLUTION:EXPLORED;
        drawCell(s.r,s.c,s.type==='solution'?SOLUTION:EXPLORED);
      }
    }
    drawCell(start[0],start[1],START);
    drawCell(end[0],end[1],END);
    const curExplored=steps.slice(0,i).filter(s=>s.type==='explore').length;
    document.getElementById('exploredTxt').textContent=curExplored;
    if(i<steps.length){
      animId=setTimeout(tick,speed);
    } else {
      setStatus(found?'Jalur ditemukan!':'Tidak ada jalur!',exploredCount,found?pathLen:'—',struct);
      solving=false;
      btnState(false,true,false);
    }
  }
  tick();
}

initCanvas();
ctx.fillStyle=getColors()[WALL];
ctx.fillRect(0,0,canvas.width,canvas.height);
ctx.fillStyle=getColors()[PATH];
ctx.font=`${CELL*3}px var(--font-mono)`;
ctx.textAlign='center';
ctx.textBaseline='middle';
ctx.fillText('?',canvas.width/2,canvas.height/2);
setStatus('Klik "Buat Labirin Baru"','—','—','—');
</script>
